# CD: build and publish container images to GitHub Container Registry (GHCR).
# This workflow only produces deliverable images from the existing per-application
# Dockerfiles. It does not deploy to any environment: no deployment target,
# credentials or rollback plan have been agreed, and production writes require
# explicit authorization.
name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Do not cancel a release build that is already publishing images.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # apps/app is intentionally absent: the React Native / Expo client needs a
      # simulator or device and is not a container service.
      matrix:
        include:
          - app: web
            context: apps/web
          - app: admin
            context: apps/admin
          - app: api
            context: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires a lowercase repository name; the owner may contain uppercase.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/modu-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The build context is the application directory only, matching the boundary
      # rule that each application builds without its siblings.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

openapi: 3.0.3
info:
  title: Your ERP API
  version: 0.1.0
security:
  - adminToken: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: 过渡期静态管理 token（Phase C 替换为真实身份）
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

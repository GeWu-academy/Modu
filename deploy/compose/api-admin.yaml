# No website or RN dependencies are included in either build context.
services:
  api:
    build:
      context: ../../apps/api
    environment:
      API_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
  admin:
    build:
      context: ../../apps/admin
    ports:
      - "127.0.0.1:8081:80"
